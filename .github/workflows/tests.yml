name: Testes Automatizados V4

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  completo-windows:
    name: Suíte Completa (20/20 · .venv)
    runs-on: windows-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências de PACOTE_MAQUINA_NOVA/requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r PACOTE_MAQUINA_NOVA/requirements.txt

      - name: Executar os 20 testes automatizados
        run: python -B -m unittest discover -s tests -v

  stdlib-windows:
    name: Somente Biblioteca Padrão (16 OK · 4 skipped)
    runs-on: windows-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Executar suíte sem pacotes externos
        run: python -B -m unittest discover -s tests -v
